<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content ="width=device-width, initial-scale=1" />
    <title>JobFinder</title>
    <link rel="stylesheet" href="style.css" />
</head>   
<body>
    <header class="hero">
        <h1>Job<span>Finder</span></h1>
        <p>Search real job listing from aroung the world.</p>
        <form id="searchForm" class="search">
            <input id="queryInput" type="text" placeholder="e.g. developer in Nairobi" required />
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <section class="controls">
            <select id ="typeFilter" aria-label="Job type">
                <option value="">All job type</option>
                <option value="full">Full-time</option>
                <option value="part">part-time</option>
                <option value="contract">contract</option>
                <option value="intern">Internship</option>
            </select>  
            
            <select id ="sortSelect" arial-label="Sort by">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="company">Company A-Z</option>
            </select>

            <label class="check">
                <input type="checkbox" id="remoteOnly" /> Remote only
            </label>
    </main>
</body> 
</html>
